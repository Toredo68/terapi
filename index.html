  <meta charset="UTF-8">
  <title>Farmakoterapi 30 Soruluk Vaka Maratonu (Set 2)</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 28px; width: 100%; max-width: 760px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .timer-container { width: 100%; background: #334155; border-radius: 8px; height: 12px; margin: 15px 0; overflow: hidden; }
    .timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: width 0.9s linear; }
    .option-btn { width: 100%; text-align: left; background: #334155; color: #f8fafc; border: 2px solid #475569; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 15px; cursor: pointer; transition: 0.2s; line-height: 1.4; }
    .option-btn:hover:not(:disabled) { background: #475569; border-color: #94a3b8; }
    .option-btn.selected { border-color: #38bdf8; background: #1e3a8a; }
    .badge { background: #0f172a; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #94a3b8; border: 1px solid #334155; }
    .player-chip { background: #0f172a; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; margin: 4px; display: inline-block; font-size: 14px; }
    .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
    .cat-badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; margin-left: 6px; }
    .cat-diyabet { background: #2563eb; color: #dbeafe; }
    .cat-hipertansiyon { background: #dc2626; color: #fee2e2; }
    .cat-diuretik { background: #059669; color: #d1fae5; }
    .cat-vaka { background: #d97706; color: #fef3c7; }
    .flashcard { background: #1e3a8a; border-left: 4px solid #38bdf8; padding: 16px; border-radius: 8px; font-size: 15px; color: #e0e7ff; margin-bottom: 15px; line-height: 1.5; }

<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-card" class="card">
    <h2>Klinik Eczacılık Maratonu (Set 2)</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px;">30 Soru: Vaka Analizleri, Şifreler ve Klinik Yorumlar (Süre: 60sn)</p>
    <input type="text" id="my-name" placeholder="Eczacı Adınızı Yazın..." maxlength="15">
    <button class="btn" onclick="enterGame()">Lobiye Katıl</button>

  <!-- BEKLEME LOBİSİ -->
  <div id="lobby-card" class="card" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
      <h3 style="margin:0;">Sınav Odası</h3>
      <span class="badge" id="player-count">0 Oyuncu</span>

      <button class="btn" style="background:#10b981;" onclick="startQuiz()">Maratonu Başlat</button>
    </div>
    <p id="wait-msg" style="text-align:center; color:#94a3b8; font-size: 14px;">Oda kurucusunun başlatması bekleniyor...</p>
  </div>

  <!-- SORU EKRANI -->
  <div id="quiz-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span class="badge" id="q-counter">Soru 1/30</span>
        <span id="q-cat" class="cat-badge">Kategori</span>
      </div>
      <span class="badge" id="time-text" style="color: #f59e0b;">60s</span>
    </div>

    <div class="timer-container">
      <div id="timer-bar" class="timer-bar"></div>

    <h3 id="question-text" style="text-align: left; font-size: 17px; min-height: 48px; color: #f8fafc; line-height: 1.5;"></h3>
    <div id="options-container"></div>
    
    <div id="status-footer" style="text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; min-height: 22px;"></div>
  </div>

  <!-- BİLGİ KARTI VE SKOR EKRANI -->
  <div id="round-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="round-result-title" style="margin:0;">Çözüm & Şifre</h3>
      <span class="badge" style="color: #38bdf8;">Sıradaki Soru (12s)...</span>
    </div>
    <p id="round-correct-ans" style="text-align:center; color:#4ade80; font-weight:600; font-size: 17px; margin: 15px 0;"></p>
    
    <!-- ÖĞRETİCİ BİLGİ KARTI -->
    <div id="flashcard-box" class="flashcard"></div>

    <div id="leaderboard" style="margin: 15px 0;"></div>
  </div>

<script>
const ROOM_NAME = "farma-klinik-vaka-sim-60sn";

const questions = [
  // HİPERTANSİYON & KARDİYOVASKÜLER (1-10)
  { q: "Hipertansiyon tanısı konulan 72 yaşındaki hastada 'İzole Sistolik Hipertansiyon' (SBP >130, DBP <80 mmHg) saptanmıştır. Bu tablo arteriyel sertliğe bağlıdır. İlk tercih edilmesi gereken kalsiyum kanal blokörü (CCB) hangisidir?", options: ["Amlodipin (Norvasc)", "Verapamil", "Diltiazem", "Labetalol"], answer: 0, tag: "Hipertansiyon", explanation: "Yaşlılarda görülen izole sistolik hipertansiyonda DHP-CCB olan Amlodipin en etkili ve en çok tercih edilen ilk basamak tedavidir[cite: 6]." },
  { q: "Diyabet ve hipertansiyonu olan hastada, idrarla protein kaçağını (albüminüriyi) engellemek amacıyla 'İkili Yarar' sağlayan ve ilk tercih edilen ilaç grubu hangisidir?", options: ["ACE İnhibitörleri (-pril) / ARB'ler (-sartan)", "Beta Blokörler (-olol)", "Alfa Blokörler (-zosin)", "Loop Diüretikleri"], answer: 0, tag: "Hipertansiyon", explanation: "ACE inhibitörleri ve ARB'ler, diyabetik nefropatide böbreği korur ve protein kaçağını (albüminüri) azaltır. Bu nedenle diyabet + hipertansiyonda ilk tercihtirler[cite: 5, 10]." },
  { q: "Hipertansiyon hastasının laboratuvar sonuçlarında 'Hiperkalsemi' (Kanda kalsiyum yüksekliği) saptanmıştır. Hastanın aşağıdaki diüretiklerden hangisini kullanıyor olması muhtemeldir?", options: ["Furosemid", "Hidroklorotiazid", "Spironolakton", "Asetazolamid"], answer: 1, tag: "Diüretik", explanation: "Tiazid diüretikleri böbrekten kalsiyumun geri emilimini artırır. Bu yüzden idrarda kalsiyumu azaltır (hipokalsiüri), kanda kalsiyumu artırır (hiperkalsemi)[cite: 5]." },
  { q: "Feokromositoma (adrenal bezde katekolamin üreten tümör) tanısı alan hipertansiyon hastasında, tedavide kesinlikle 'ÖNCE' başlanması gereken ilaç grubu hangisidir?", options: ["Alfa Blokörler", "Beta Blokörler", "Kalsiyum Kanal Blokörleri", "ACE İnhibitörleri"], answer: 0, tag: "Hipertansiyon", explanation: "Feokromositomada önce Alfa Blokör başlanır. Eğer önce Beta Blokör başlanırsa ölümcül rebound hipertansiyon (ani tansiyon fırlaması) gelişir[cite: 6]." },
  { q: "Primer Hiperaldosteronizm (Conn Sendromu) şüphesi olan bir hastada Aldosteron/Renin oranına bakılmıştır. Tanıyı kesinleştirmek (doğrulamak) için hastaya hangi sıvı infüzyonu yapılır?", options: ["2 Litre %0.9 NaCl (SF)", "1 Litre %5 Dekstroz", "GİK Solüsyonu", "Mannitol %20"], answer: 0, tag: "Hipertansiyon", explanation: "Conn sendromu tanısını kesinleştirmek için hastaya 2 litre SF (Sodyum Klorür) verilir. Sonrasında aldosteron hala >10 ise tanı kesinleşir[cite: 6]." },
  { q: "Gastrointestinal (GI) kanama nedeniyle acile getirilen hastada, kanamayı durdurmak için hangi Proton Pompa İnhibitörünün (PPI) İntravenöz (IV) yoldan uygulanması KESİNLİKLE YANLIŞTIR?", options: ["Pantoprazol", "Esomeprazol", "Omeprazol", "Rabeprazol"], answer: 3, tag: "Vaka", explanation: "Rabeprazol'ün IV formu yoktur. GİS kanamada oral ilaç emilemeyeceği için Pantoprazol, Esomeprazol veya Omeprazol'ün IV formu (2x1) başlanmalıdır[cite: 11]." },
  { q: "Hipertansiyon şikayetiyle başvuran hastanın ev ölçümleri normal iken (örn: 120/80 mmHg), klinik ölçümleri sürekli yüksek (örn: 150/95 mmHg) çıkmaktadır. Bu duruma ne ad verilir?", options: ["Beyaz Önlük Hipertansiyonu", "Maskeli Hipertansiyon", "Hipertansif Acil (Emergency)", "İzole Sistolik Hipertansiyon"], answer: 0, tag: "Hipertansiyon", explanation: "Hastanın sadece doktor yanında/klinikte tansiyonunun yükselmesine Beyaz Önlük Hipertansiyonu denir. Bunu dışlamak için Ambulatuvar (Holter) ölçüm istenir[cite: 6]." },
  { q: "Atriyal Fibrilasyon nedeniyle Direkt Oral Antikoagülan (DOAK) başlanması planlanan hastada, böbrek yetmezliği olduğu için büyük oranda böbrekten atılan hangi ilaç KONTRENDİKEDİR?", options: ["Dabigatran", "Apiksaban", "Rivaroksaban", "Edoksaban"], answer: 0, tag: "Vaka", explanation: "Dabigatran %80 oranında böbreklerden atılır, bu nedenle böbrek yetmezliğinde uygun değildir. Yerine böbrekten daha az atılan Apiksaban tercih edilir[cite: 11]." },
  { q: "Hipertansiyon tedavisinde kullanılan Santral Alfa-2 agonistlerinden olan ve 'Gebelikte güvenle kullanılan HMLN' şifresinde yer alan etken madde hangisidir?", options: ["Metildopa", "Minoksidil", "Hidralazin", "Aliskiren"], answer: 0, tag: "Hipertansiyon", explanation: "HMLN Şifresi: Hidralazin, Metildopa, Labetalol, Nifedipin. Metildopa, gebelikte güvenli olan bir santral alfa-2 agonistidir[cite: 5]." },
  { q: "Kalp yetmezliği (Düşük ejeksiyon fraksiyonlu) olan hastada ölüm riskini (mortaliteyi) azalttığı bilinen ARNI (Anjiyotensin Reseptör Neprilisin İnhibitörü) grubu ilaç hangisidir?", options: ["Sakubitril + Valsartan (Oneptus)", "Trandolapril + Verapamil (Tarka)", "Metoprolol ZOK (Beloc ZOK)", "Furosemid (Lasix)"], answer: 0, tag: "Hipertansiyon", explanation: "ARNI grubu, Sakubitril ve Valsartan kombinasyonundan oluşur. Kalp yetmezliğinde mortaliteyi azaltan çok önemli ve özel bir ilaçtır[cite: 10]." },

  // DİYABET & ORAL ANTİDİYABETİKLER (11-20)
  { q: "Tip 2 diyabet hastasında HbA1c değeri %9.2, C-peptid değeri ise 0.3 ng/mL olarak ölçülmüştür. Bu klinik tablo ne anlama gelmektedir ve hangi tedavi KESİNLİKLE şarttır?", options: ["İnsülin rezervi bitmiştir; Bazal + Bolus İnsülin başlanmalıdır.", "İnsülin direnci artmıştır; sadece yüksek doz Metformin yeterlidir.", "Hastada Tip 1 Diyabet gelişmiştir; Pankreas nakli yapılmalıdır.", "Hasta gizli şekerdir (Prediyabet); Yaşam Tarzı Değişikliği yeterlidir."], answer: 0, tag: "Diyabet", explanation: "C-peptid < 0.5 ise pankreastaki insülin rezervi tükenmiştir. Dışarıdan insülin vermek (Bazal ve Bolus) zorunludur[cite: 8, 10]." },
  { q: "Tip 2 diyabet hastasında boyun ve ensede 'kadifemsi kararma' olan Akantozis Nigrikans ve Karaciğer Yağlanması (NASH) saptanmıştır. Bu durumda kullanılabilecek en ideal İnsülin Duyarlaştırıcı ajan hangisidir?", options: ["Pioglitazon", "Glipizid", "Sitagliptin", "Akarboz"], answer: 0, tag: "Diyabet", explanation: "Akantozis Nigrikans insülin direncinin bulgusudur. NASH (Non-alkolik steatohepatit) varlığında ilk tercih edilecek ilaç Tiazolidindion grubu olan Pioglitazon'dur[cite: 8]." },
  { q: "Hipoglisemi riski yüksek olan (örn. sık sık bayılan) 75 yaşındaki Tip 2 diyabet hastasına aşağıdaki sülfonilürelerden hangisinin başlanması YANLIŞTIR?", options: ["Glibenklamid (Gliburid)", "Glipizid", "Gliklazid", "Glimepirid"], answer: 0, tag: "Diyabet", explanation: "Glibenklamid (Gliburid) uzun yarı ömürlüdür ve yaşlılarda derin hipoglisemi, düşme ve kalça kırığı riski yaratır. Yaşlılarda Glipizid veya Gliklazid tercih edilmelidir[cite: 8]." },
  { q: "Kısa ve Hızlı Etkili (Bolus) İnsülinlerin en önemli özelliği nedir ve ne zaman uygulanmalıdır?", options: ["Tokluk kan şekerine etki ederler, yemekten hemen önce (15-30 dk) uygulanırlar.", "Açlık kan şekerine etki ederler, gece yatmadan önce uygulanırlar.", "Etkileri 24 saat sürer, günün herhangi bir saatinde uygulanabilirler.", "Sadece intramüsküler (kas içine) uygulanırlar."], answer: 0, tag: "Diyabet", explanation: "Bolus (İçindeki O harfinden: Tokluk). Hızlı/Kısa etkili insülinler (Lispro, Aspart, Regüler) postprandiyal (tokluk) şekerini düşürmek için öğün öncesi uygulanır[cite: 9]." },
  { q: "Bulanık (bulutsu) süspansiyon formunda olduğu için damarı tıkayacağı gerekçesiyle KESİNLİKLE İntravenöz (IV) yoldan uygulanmaması gereken 'Orta Etkili' (Bazal) insülin hangisidir?", options: ["NPH (İzofan Protamin İnsülin)", "Regüler (Kristalize) İnsülin", "İnsülin Glarjin", "İnsülin Lispro"], answer: 0, tag: "Diyabet", explanation: "NPH İnsülin bulanık bir süspansiyondur. İyice karışması için kullanmadan önce 10 kez iki el arasında yavaşça çevrilmeli ve ASLA IV yoldan uygulanmamalıdır[cite: 9]." },
  { q: "Şizofreni tedavisi gören ve obezitesi olan bir hastada Tip 2 diyabet gelişmiştir. Hastanın mevcut ilaçları arasında kan şekerini şiddetle yükselten ve kilo aldıran hangi antipsikotik olabilir?", options: ["Olanzapin veya Klozapin", "Aripiprazol", "Ziprasidon", "Haloperidol"], answer: 0, tag: "Diyabet", explanation: "Olanzapin ve Klozapin kan şekerini ve kiloyu ciddi şekilde artırır. Diyabetik veya obez hastalarda bunların yerine Aripiprazol veya Ziprasidon tercih edilmelidir[cite: 10]." },
  { q: "Diyabetik hastada el ve ayak parmaklarında karıncalanma ve hissizlik (Nöropati) şikayetleri için aşağıdaki ajanlardan hangisi KULLANILMAZ?", options: ["Dobesilat (Modet)", "Pregabalin (Lyrica)", "Gabapentin (Gabaset)", "Alfa-Lipoik Asit (Thioctacid)"], answer: 0, tag: "Diyabet", explanation: "Dobesilat (Modet) ve Trokserutin (Venoruton) diyabetik nöropatide değil, diyabetik RETİNOPATİDE (göz damarlarının çatlaması) kullanılır[cite: 9]." },
  { q: "25 yaş altında Tip 2 diyabet benzeri semptomlarla ortaya çıkan, insülin direnci ve otoantikorları OLMAYAN, genetik (en az 2 kuşak öykülü) diyabet formuna ne ad verilir?", options: ["MODY", "LADA", "Gestasyonel Diyabet", "Prediyabet"], answer: 0, tag: "Diyabet", explanation: "MODY (Maturity-Onset Diabetes of the Young), gençlerde görülen Tip 2 benzeri genetik formdur. Tedavisinde sülfonilüreler mükemmel yanıt verir[cite: 10]." },
  { q: "Aşağıdaki ilaç gruplarından hangisi pankreastaki beta hücrelerinden insülin salgısını artırarak etki eder (Sekretagoglar) ve bu nedenle HİPOGLİSEMİ riski taşır?", options: ["Sülfonilüreler ve Meglitinidler", "SGLT2 İnhibitörleri ve DPP-4 İnhibitörleri", "Biguanidler ve Tiazolidindionlar", "Alfa Glikozidaz İnhibitörleri"], answer: 0, tag: "Diyabet", explanation: "Sülfonilüreler (Örn: Glimepirid) ve Meglitinidler (Örn: Repaglinid) insülin salgılatıcı (sekretagog) oldukları için direkt hipoglisemi riski yaratırlar[cite: 8]." },
  { q: "Akarboz kullanan diyabet hastası için aşağıda verilen eczacı uyarılarından hangisi DOĞRUDUR?", options: ["İlacı mutlaka yemeğin ilk lokması ile birlikte almalısınız.", "Bu ilaç kabızlık yapar, bol su içmelisiniz.", "Eğer öğünü atlarsanız, ilacı yine de almalısınız.", "Sadece basit şeker yediğinizde ilacı almalısınız."], answer: 0, tag: "Vaka", explanation: "Akarboz, karbonhidrat emilimini geciktirmek için yemeklerle (ilk lokmayla) alınmalıdır. Basit şekerlere etkisi yoktur. Yan etki olarak gaz ve diyare (ishal) yapar[cite: 7]." },

  // DİÜRETİKLER & KARMA KLİNİK VAKALAR (21-30)
  { q: "Kalp yetmezliğine bağlı ciddi ödemi olan ve böbrek fonksiyonları zayıflamış (eGFR <30) hastada, en güçlü diüretik etkiye sahip olan HANGİ İLAÇ GRUBU tercih edilmelidir?", options: ["Loop (Kıvrım) Diüretikleri (Örn: Furosemid)", "Tiazid Diüretikleri (Örn: HCTZ)", "Karbonik Anhidraz İnhibitörleri (Örn: Asetazolamid)", "Ozmotik Diüretikler (Örn: Mannitol)"], answer: 0, tag: "Diüretik", explanation: "Loop diüretikleri (Furosemid, Torasemid) böbreğin idrarı konsantre etme yeteneğini kırar ve KBY hastalarında ödemi çözmek için en güçlü ajanlardır[cite: 5]." },
  { q: "Glokom (Göz tansiyonu) tedavisi için göz damlası olarak reçete edilen Dorzolamid ve Brinzolamid, diüretiklerin hangi sınıfına aittir?", options: ["Karbonik Anhidraz İnhibitörleri", "Potasyum Tutucu Diüretikler", "Loop Diüretikleri", "Tiazid Diüretikleri"], answer: 0, tag: "Diüretik", explanation: "Karbonik Anhidraz İnhibitörlerinden Asetazolamid (oral) metabolik alkaloz ve akut dağ hastalığında; Dorzolamid ve Brinzolamid ise sadece glokomda göz damlası olarak kullanılır[cite: 5]." },
  { q: "Hastaya Kafa İçi Basınç Artışı Sendromu (KİBAS) tanısı konulmuştur. Beyin ödemini azaltmak için hangi Ozmotik Diüretik İntravenöz (IV) yolla verilmelidir?", options: ["Mannitol", "Furosemid", "Spironolakton", "Klortalidon"], answer: 0, tag: "Diüretik", explanation: "Mannitol tek ozmotik diüretik ajanıdır. KİBAS gibi durumlarda beyin ödemini çekmek için kullanılır. (Sorbitol ise laksatif olarak kullanılır)[cite: 5, 10]." },
  { q: "Tiazid (HCTZ) kullanan bir hastada kan tahlili sonucunda aşağıdaki elektrolit bozukluklarından hangisinin görülmesi BEKLENMEZ?", options: ["Hipokalsemi (Kalsiyum düşüklüğü)", "Hipokalemi (Potasyum düşüklüğü)", "Hiponatremi (Sodyum düşüklüğü)", "Hiperürisemi (Ürik asit yüksekliği)"], answer: 0, tag: "Diüretik", explanation: "Tiazidler kalsiyumu TUTAR, yani hiperkalsemi (kanda yüksek kalsiyum) yapar. Hipokalsemi yapanlar Loop diüretikleridir[cite: 5]." },
  { q: "Diyabet hastalarının yılda bir kez yaptırması KESİNLİKLE zorunlu olan rutin taramalar arasında hangisi YOKTUR?", options: ["Endoskopi (Mide Muayenesi)", "Göz Muayenesi (Retinopati için)", "Kapsamlı Ayak Muayenesi (Nöropati için)", "Diş Muayenesi (Diş çürümesi için)"], answer: 0, tag: "Diyabet", explanation: "Diyabet hastaları retinopati için göz, nöropati/diyabetik ayak için ayak, ve çürümeler için diş muayenesini her yıl yaptırmalıdır. Rutin endoskopi şartı yoktur[cite: 10]." },
  { q: "Diyabetik hastada Aşırı Doz Metformin kullanımına bağlı veya böbrek yetmezliğine bağlı gelişebilen 'Laktik Asidoz' tablosunun kanda görülen laboratuvar karşılığı nedir?", options: ["Laktat >5, pH <7.35, Bikarbonat <20", "Laktat <2, pH >7.45, Bikarbonat >30", "Laktat >5, pH >7.45, Bikarbonat >30", "Sadece keton cisimcikleri pozitiftir."], answer: 0, tag: "Vaka", explanation: "Laktik Asidoz tanımı: Kanda laktatın (süt asidi) 5'in üzerine çıkması, kan pH'ının 7.35'in (asidoz) ve bikarbonatın 20'nin altına düşmesidir[cite: 8]." },

// Şıkları karıştırma ve doğru cevabın yeni indeksini bulma
questions.forEach(qObj => {
  const correctText = qObj.options[qObj.answer];
  for (let i = qObj.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qObj.options[i], qObj.options[j]] = [qObj.options[j], qObj.options[i]];
  }
  qObj.answer = qObj.options.indexOf(correctText);
});

// Soruları genel olarak rastgele harmanlama
for (let i = questions.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [questions[i], questions[j]] = [questions[j], questions[i]];
}

let peer = null;
let isHost = false;
let myName = "";
let myPeerId = "";
let hostConn = null;

let players = [];
let currentQ = -1;
let timer = null;
let timeLeft = 60; // Vaka okuma süresi 60 saniye

function enterGame() {
  myName = document.getElementById('my-name').value.trim();
  if (!myName) return alert("Lütfen adınızı girin!");

  document.getElementById('login-card').style.display = 'none';
  document.getElementById('lobby-card').style.display = 'block';

  peer = new Peer(ROOM_NAME);

  peer.on('open', (id) => {
    isHost = true;
    myPeerId = id;
    players.push({ id: myPeerId, name: myName, score: 0, correctCount: 0, streak: 0, answer: null, wasCorrect: false });
    document.getElementById('host-actions').style.display = 'block';
    document.getElementById('wait-msg').style.display = 'none';
    renderLobby();

    peer.on('connection', (conn) => {
      conn.on('data', (data) => handleHostData(conn, data));
      conn.on('close', () => {
        players = players.filter(p => p.id !== conn.peer);
        renderLobby();
        broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
      });
    });
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      isHost = false;
      joinAsClient();
    }
  });
}

function joinAsClient() {
  peer = new Peer();
  peer.on('open', (id) => {
    myPeerId = id;
    hostConn = peer.connect(ROOM_NAME);
    hostConn.on('open', () => {
      hostConn.send({ type: 'JOIN', name: myName });
    });
    hostConn.on('data', (data) => handleClientData(data));
  });
}

function handleHostData(conn, data) {
  if (data.type === 'JOIN') {
    players.push({ conn, id: conn.peer, name: data.name, score: 0, correctCount: 0, streak: 0, answer: null, wasCorrect: false });
    renderLobby();
    broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
  } else if (data.type === 'SUBMIT_ANSWER') {
    const p = players.find(x => x.id === conn.peer);
    if (p && p.answer === null) {
      p.answer = data.choice;
      checkAllAnswered();
    }
  }
}

function broadcast(msg) {
  players.forEach(p => {
    if (p.conn && p.conn.open) p.conn.send(msg);
  });
}

function renderLobby() {
  document.getElementById('player-count').innerText = `${players.length} Eczacı`;
  document.getElementById('lobby-players').innerHTML = players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
}

function startQuiz() {
  currentQ = -1;
  broadcast({ type: 'START' });
  nextQuestion();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    broadcast({ type: 'GAME_OVER' });
    handleClientData({ type: 'GAME_OVER' });
    return;
  }

  players.forEach(p => { p.answer = null; p.wasCorrect = false; });

  const q = questions[currentQ];
  const qData = {
    type: 'QUESTION',
    index: currentQ,
    total: questions.length,
    q: q.q,
    options: q.options,
    tag: q.tag,
    explanation: q.explanation
  };

  broadcast(qData);
  handleClientData(qData);
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 60;
  timer = setInterval(() => {
    timeLeft--;
    broadcast({ type: 'TICK', timeLeft });
    handleClientData({ type: 'TICK', timeLeft });

    if (timeLeft <= 0) {
      clearInterval(timer);
      evaluateRound();
    }
  }, 1000);
}

function checkAllAnswered() {
  const allDone = players.every(p => p.answer !== null);
  if (allDone) {
    clearInterval(timer);
    evaluateRound();
  }
}

function evaluateRound() {
  const correctIdx = questions[currentQ].answer;

  players.forEach(p => {
    if (p.answer === correctIdx) {
      p.wasCorrect = true;
      p.correctCount += 1;
      p.streak += 1;

      let gained = 100;
      if (p.streak >= 3) gained += 25;

      p.score += gained;
    } else {
      p.wasCorrect = false;
      p.streak = 0;
    }
  });

  players.sort((a, b) => b.score - a.score);

  const resultData = {
    type: 'ROUND_OVER',
    correctAnswer: questions[currentQ].options[correctIdx],
    explanation: questions[currentQ].explanation,
    leaderboard: players.map(p => ({ 
      name: p.name, 
      score: p.score, 
      correctCount: p.correctCount,
      streak: p.streak,
      wasCorrect: p.wasCorrect 
    })),
    isLast: currentQ + 1 >= questions.length
  };

  broadcast(resultData);
  handleClientData(resultData);

  // 12 Saniye Bilgi Kartı Bekleme Süresi
  if (!resultData.isLast) {
    setTimeout(() => {
      nextQuestion();
    }, 12000);
  } else {
    setTimeout(() => {
      broadcast({ type: 'GAME_OVER' });
      handleClientData({ type: 'GAME_OVER' });
    }, 12000);
  }
}

let selectedChoice = null;

function handleClientData(data) {
  if (data.type === 'LOBBY_UPDATE') {
    document.getElementById('player-count').innerText = `${data.players.length} Eczacı`;
    document.getElementById('lobby-players').innerHTML = data.players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
  } else if (data.type === 'START') {
    document.getElementById('lobby-card').style.display = 'none';
  } else if (data.type === 'QUESTION') {
    selectedChoice = null;
    document.getElementById('lobby-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';

    document.getElementById('q-counter').innerText = `Soru ${data.index + 1}/${data.total}`;
    
    const tagElem = document.getElementById('q-cat');
    tagElem.innerText = data.tag;
    if (data.tag === 'Diyabet') tagElem.className = 'cat-badge cat-diyabet';
    else if (data.tag === 'Hipertansiyon') tagElem.className = 'cat-badge cat-hipertansiyon';
    else if (data.tag === 'Vaka') tagElem.className = 'cat-badge cat-vaka';
    else tagElem.className = 'cat-badge cat-diuretik';

    document.getElementById('question-text').innerText = data.q;
    document.getElementById('status-footer').innerText = "Cevabınızı seçin...";
    document.getElementById('timer-bar').style.width = '100%';

    const optBox = document.getElementById('options-container');
    optBox.innerHTML = '';
    data.options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      b.onclick = () => submitAnswer(idx, b);
      optBox.appendChild(b);
    });
  } else if (data.type === 'TICK') {
    document.getElementById('time-text').innerText = `${data.timeLeft}s`;
    document.getElementById('timer-bar').style.width = `${(data.timeLeft / 60) * 100}%`;
  } else if (data.type === 'ROUND_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';

    document.getElementById('round-correct-ans').innerText = `Doğru Cevap: ${data.correctAnswer}`;
    document.getElementById('flashcard-box').innerHTML = `<strong>💡 Klinik Şifre:</strong> ${data.explanation}`;
    
    const lb = document.getElementById('leaderboard');
    lb.innerHTML = data.leaderboard.map((p, i) => {
      const statusIcon = p.wasCorrect ? (p.streak >= 2 ? `🔥x${p.streak}` : '✅') : '❌';
      return `
        <div class="leaderboard-row">
          <span>#${i + 1} ${p.name} <span style="font-size: 18px; margin-left: 6px;">${statusIcon}</span></span>
          <span style="color:#38bdf8;">${p.score} Puan <small style="color:#94a3b8; margin-left:8px;">(${p.correctCount} Doğru)</small></span>
        </div>
      `;
    }).join('');
  } else if (data.type === 'GAME_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';
    document.getElementById('round-result-title').innerText = "🏆 2. Maraton Tamamlandı! 🏆";
    document.getElementById('round-correct-ans').innerText = "Simülasyon sona erdi.";
    document.getElementById('flashcard-box').style.display = 'none';
  }
}

function submitAnswer(idx, btnElem) {
  if (selectedChoice !== null) return;
  selectedChoice = idx;

  btnElem.classList.add('selected');
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  document.getElementById('status-footer').innerText = "Cevabınız iletildi! Diğerleri bekleniyor...";

  const payload = { type: 'SUBMIT_ANSWER', choice: idx };
  if (isHost) {
    const me = players.find(p => p.id === myPeerId);
    if (me) { me.answer = idx; checkAllAnswered(); }
  } else if (hostConn) {
    hostConn.send(payload);
  }
}
</script>
