  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 28px; width: 100%; max-width: 760px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .timer-container { width: 100%; background: #334155; border-radius: 8px; height: 12px; margin: 15px 0; overflow: hidden; }
    .timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: width 0.9s linear; }
    .option-btn { width: 100%; text-align: left; background: #334155; color: #f8fafc; border: 2px solid #475569; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 15px; cursor: pointer; transition: 0.2s; line-height: 1.4; }
    .option-btn:hover:not(:disabled) { background: #475569; border-color: #94a3b8; }
    .option-btn.selected { border-color: #38bdf8; background: #1e3a8a; }
    .badge { background: #0f172a; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #94a3b8; border: 1px solid #334155; }
    .player-chip { background: #0f172a; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; margin: 4px; display: inline-block; font-size: 14px; }
    .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
    .cat-badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; margin-left: 6px; }
    .cat-diyabet { background: #2563eb; color: #dbeafe; }
    .cat-hipertansiyon { background: #dc2626; color: #fee2e2; }
    .cat-diuretik { background: #059669; color: #d1fae5; }
    .cat-vaka { background: #d97706; color: #fef3c7; }
    .flashcard { background: #1e3a8a; border-left: 4px solid #38bdf8; padding: 16px; border-radius: 8px; font-size: 15px; color: #e0e7ff; margin-bottom: 15px; line-height: 1.5; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-card" class="card">
    <h2>Klinik Eczacılık Maratonu</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px;">30 Soru: Vaka Analizleri, Şifreler ve Klinik Yorumlar</p>
    <input type="text" id="my-name" placeholder="Eczacı Adınızı Yazın..." maxlength="15">
    <button class="btn" onclick="enterGame()">Lobiye Katıl</button>
  </div>

  <!-- BEKLEME LOBİSİ -->
  <div id="lobby-card" class="card" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
      <h3 style="margin:0;">Sınav Odası</h3>
      <span class="badge" id="player-count">0 Oyuncu</span>

    <p style="color: #94a3b8; font-size: 14px;">Katılanlar:</p>

    <div id="host-actions" style="display: none;">
      <button class="btn" style="background:#10b981;" onclick="startQuiz()">Maratonu Başlat</button>
    </div>
    <p id="wait-msg" style="text-align:center; color:#94a3b8; font-size: 14px;">Oda kurucusunun başlatması bekleniyor...</p>
  </div>

  <!-- SORU EKRANI -->
  <div id="quiz-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span class="badge" id="q-counter">Soru 1/30</span>
        <span id="q-cat" class="cat-badge">Kategori</span>
      </div>
      <span class="badge" id="time-text" style="color: #f59e0b;">30s</span>
    </div>

    <div class="timer-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <h3 id="question-text" style="text-align: left; font-size: 17px; min-height: 48px; color: #f8fafc; line-height: 1.5;"></h3>
    <div id="options-container"></div>
    
    <div id="status-footer" style="text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; min-height: 22px;"></div>
  </div>

  <!-- BİLGİ KARTI VE SKOR EKRANI -->
  <div id="round-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="round-result-title" style="margin:0;">Çözüm & Şifre</h3>
      <span class="badge" style="color: #38bdf8;">Sıradaki Vaka (12s)...</span>
    </div>
    <p id="round-correct-ans" style="text-align:center; color:#4ade80; font-weight:600; font-size: 17px; margin: 15px 0;"></p>
    
    <!-- ÖĞRETİCİ BİLGİ KARTI -->
    <div id="flashcard-box" class="flashcard"></div>

    <div id="leaderboard" style="margin: 15px 0;"></div>
  </div>

<script>
const ROOM_NAME = "farma-klinik-vaka-sim-30";

const questions = [
  // 1-5 (Önceki Sorular)
  { q: "65 yaşında kalp yetmezliği (NYHA Sınıf 3) olan Tip 2 diyabet hastasında aşağıdaki DPP-4 inhibitörlerinden hangisi KESİNLİKLE kontrendikedir?", options: ["Linagliptin", "Saksagliptin", "Sitagliptin", "Vildagliptin"], answer: 1, tag: "Diyabet", explanation: "Şifre: A-S (Alogliptin ve Saksagliptin kalbi asar). Bu iki gliptin kalp yetmezliği semptomlarını kötüleştirdiği için kalp yetmezliğinde kontrendikedir." },
  { q: "eGFR değeri 28 mL/dk (İleri Evre KBY) olan bir hastada renal doz ayarı gerektirmeksizin güvenle başlanabilecek tek DPP-4 inhibitörü hangisidir?", options: ["Vildagliptin", "Alogliptin", "Sitagliptin", "Linagliptin"], answer: 3, tag: "Diyabet", explanation: "Şifre: Lina = Güvenli Liman. Linagliptin karaciğer/safra yoluyla atılır. Böbrekten atılmayan ve böbrek yetmezliğinde doz ayarı gerektirmeyen tek gliptindir." },
  { q: "Hipertansiyon ve osteoporozu olan bir hastada, idrarda kalsiyum atılımını azaltarak (hipokalsiüri) kemik erimesine karşı ikili yarar sağlayan diüretik grubu hangisidir?", options: ["Loop (Kıvrım) Diüretikleri", "Tiazid Diüretikleri", "Potasyum Tutucu Diüretikler", "Ozmotik Diüretikler"], answer: 1, tag: "Diüretik", explanation: "Zıtlık Kuralı: Tiazidler kalsiyumu TUTAR (kanda artırır, idrarda azaltır), Loop diüretikleri ise ATAR (hipokalsemi yapar). Osteoporozda Tiazid ilk tercihtir." },
  { q: "Furosemid (Loop diüretiği) kullanan bir hastada şiddetli kulak çınlaması (ototoksisite) başlamıştır. Hastanın reçetesindeki hangi ilaç bu yan etkiyi tetiklemiş olabilir?", options: ["Aspirin", "Parasetamol", "Metformin", "Klopidogrel"], answer: 0, tag: "Diüretik", explanation: "Şifre: CALM EAR. Cisplatin, Aminoglikozit, Loop diüretikleri, Malarya ilacı, Eritromisin, Aspirin ve Red Man (Vankomisin) ototoksiktir. Furosemid + Aspirin kulak çınlaması yapar." },
  { q: "Morbid obezitesi olan Tip 2 diyabet hastasında kilo vermesi hedeflenmektedir. Bu hastada kilo artışına sebep olacağı için BAŞLANMAMASI gereken ilaç grubu hangisidir?", options: ["SGLT2 İnhibitörleri", "GLP-1 Agonistleri", "Sülfonilüreler", "Biguanidler"], answer: 2, tag: "Diyabet", explanation: "Şifre: SİMİT. Sülfonilüre, Meglitinid ve Tiazolidindion grupları kilo aldırır. Bu hastada kilo verdiren GLP-1 agonisti veya Metformin tercih edilmelidir." },
  
  // VAKA GÖRSELİNDEN SORULAR (6-7)
  { q: "62 yaşında N.K., Tip 2 diyabet, hipertansiyon ve morbid obezite tanılıdır. İdrar tahlilinde mikroalbüminüri (++) görülmüştür. Bu hastada protein kaçağını (nefropatiyi) engellemek için mevcut tedavisine hangi ajan eklenmelidir?", options: ["Sülfonilüre (Örn: Glipizid)", "SGLT2 İnhibitörü (Örn: Empagliflozin)", "Alfa Glikozidaz İnhibitörü (Örn: Akarboz)", "Tiazolidindion (Örn: Pioglitazon)"], answer: 1, tag: "Vaka", explanation: "Vaka Analizi: Hastada mikroalbüminüri (Nefropati) var. Hem proteinüriyi azaltmak hem de kilo kaybı (obezite) sağlamak için SGLT2 inhibitörleri (Gliflozinler) en ideal seçenektir." },
  { q: "Aynı morbid obez hastanın mevcut ilaçları arasında Glipizid 5 mg bulunmaktadır. Hasta son birkaç ayda 8 kg aldığını belirtmektedir. Bu durumda Eczacının yaklaşımı ne olmalıdır?", options: ["Glipizid dozu artırılmalıdır.", "Glipizid kesilmeli, kilo verdiren bir ajana (Örn: GLP-1 agonisti) geçilmelidir.", "Glipizid yanına İnsülin eklenmelidir.", "Hastaya diyet yapması söylenip Glipizid'e devam edilmelidir."], answer: 1, tag: "Vaka", explanation: "Vaka Analizi: Glipizid bir sülfonilüredir ve 'SİMİT' şifresine göre kilo aldırır. Hasta zaten morbid obez ve 8 kg almış. İlaç derhal kesilip GLP-1 agonisti veya SGLT2 başlanmalıdır." },

  // DİYABET ŞİFRELERİ (8-15)
  { q: "Gebelikte (Gestasyonel Diyabet) aşağıdaki insülinlerden hangisinin kullanılması KONTRENDİKEDİR?", options: ["İnsülin Aspart", "İnsülin Detemir", "İnsülin Glarjin", "NPH İnsülin"], answer: 2, tag: "Diyabet", explanation: "Şifre: 'G' ile başlayan insülinler (Glarjin, Glulisin) ve ultra uzun etkililer gebelikte verilmez. Aspart, Lispro, Detemir ve NPH güvenlidir." },
  { q: "Ailesinde Medüller Tiroid Kanseri öyküsü olan bir Tip 2 diyabet hastasında aşağıdaki ilaç gruplarından hangisi kesinlikle KONTRENDİKEDİR?", options: ["GLP-1 Reseptör Agonistleri", "DPP-4 İnhibitörleri", "SGLT2 İnhibitörleri", "Biguanidler"], answer: 0, tag: "Diyabet", explanation: "Kanser Eşleştirmesi: GLP-1 = Tiroid Kanseri. DPP-4 = Pankreas Kanseri. Pioglitazon/SGLT2 = Mesane Kanseri." },
  { q: "Ailesinde Mesane Kanseri öyküsü olan ve idrarında kan (hematüri) görülen hastada aşağıdaki ilaçlardan hangisi derhal kesilmelidir?", options: ["Metformin", "Pioglitazon", "Sitagliptin", "Akarboz"], answer: 1, tag: "Diyabet", explanation: "Kanser Eşleştirmesi: Pioglitazon (Tiazolidindion) mesane kanseri riskini artırır. Aile öyküsü varsa kontrendikedir." },
  { q: "İyotlu kontrast madde (İohexol) kullanılarak tomografi çekilecek bir diyabet hastasında Metformin tedavisi nasıl yönetilmelidir?", options: ["İşlem günü doz iki katına çıkarılır.", "İşlemden 48 saat önce Metformin kesilir.", "İşlem sonrası bol şekerli su içirilir.", "Metformin yerine geçici olarak Sülfonilüre başlanır."], answer: 1, tag: "Diyabet", explanation: "Metformin ve kontrast madde birlikte böbrek hasarı ve laktik asidoz yapabilir. Bu nedenle kontrastlı işlemden 48 saat önce Metformin kesilmelidir." },
  { q: "Akarboz ve İnsülin kullanan bir hastada titreme ve terleme ile seyreden hipoglisemi gelişmiştir. Bu hastanın hipoglisemisi aşağıdakilerden hangisi ile tedavi edilmelidir?", options: ["Çay şekeri (Sükroz)", "Saf glikoz (Dekstroz)", "Sütlü çikolata", "Meyve suyu"], answer: 1, tag: "Diyabet", explanation: "Klinik Püf Nokta: Akarboz (Alfa glikozidaz inhibitörü) disakkaritlerin (çay şekeri) bağırsakta monosakkaritlere parçalanmasını engeller. Bu yüzden hipoglisemi sadece saf glikozla çözülebilir." },
  { q: "Gece 23:00'te uygulanan insülin dozunun FAZLA gelmesi nedeniyle hastanın gece 03:00'te hipoglisemiye girip, sabah kalktığında reaktif olarak hiperglisemi yaşamasına ne ad verilir?", options: ["Dawn (Şafak) Fenomeni", "Somogyi Fenomeni", "İnsülin Direnci", "Balayı Fazı"], answer: 1, tag: "Diyabet", explanation: "Somogyi Fenomeni: Doz FAZLA gelmiştir, gece hipo -> sabah hiper görülür (Doz azaltılır). Dawn (Şafak) Fenomeninde ise doz YETERSİZDİR, gece ve sabah hep hiper görülür (Doz artırılır)." },
  { q: "Aşağıdaki diyabet tanısı kriterlerinden hangisi YANLIŞTIR?", options: ["Açlık Kan Şekeri (AKŞ) ≥ 126 mg/dL", "Oral Glikoz Tolerans Testi (OGTT) 2. Saat ≥ 200 mg/dL", "Açlık Kan Şekeri (AKŞ) ≥ 110 mg/dL", "Hemoglobin A1c (HbA1c) ≥ %6.5"], answer: 2, tag: "Diyabet", explanation: "AKŞ 100-125 arası 'Prediyabet'tir. Diyabet tanısı için AKŞ'nin en az 126 mg/dL olması gerekir." },
  { q: "Tip 2 diyabet hastasında eGFR (Glomerüler Filtrasyon Hızı) değerinin 30 mL/dk altına düşmesi (Şiddetli KBY) durumunda KESİNLİKLE kontrendike olan ilk basamak ilacı hangisidir?", options: ["Linagliptin", "Metformin", "Repaglinid", "İnsülin Glarjin"], answer: 1, tag: "Diyabet", explanation: "Laktik asidoz riski nedeniyle eGFR < 30 mL/dk olduğunda Metformin KESİNLİKLE kontrendikedir ve derhal kesilmelidir." },

  // HİPERTANSİYON VE DİÜRETİK ŞİFRELERİ (16-25)
  { q: "Gebelikte hipertansiyon tedavisinde kullanılması güvenli olan 'HMLN' şifresine DAHİL OLMAYAN (Kontrendike olan) ajan hangisidir?", options: ["Metildopa", "Nifedipin", "Labetalol", "Lisinopril"], answer: 3, tag: "Hipertansiyon", explanation: "Şifre: HMLN (Hidralazin, Metildopa, Labetalol, Nifedipin) gebelikte güvenlidir. Lisinopril bir ACE inhibitörüdür ve gebelikte kesinlikle kontrendikedir." },
  { q: "Prostat hiperplazisi (BPH) ve hipertansiyonu olan hastaya ikili yarardan dolayı Doksazosin (Alfa blokör) başlanmıştır. Eczacı ilacı verirken hastayı hangi yan etki konusunda ÖZELLİKLE uyarmalıdır?", options: ["Sabah aç karnına almalısınız.", "İlk dozu gece yatmadan önce almalısınız, aksi halde bayılabilirsiniz.", "İdrar renginiz maviye dönebilir.", "Potasyumdan zengin gıdalar tüketmelisiniz."], answer: 1, tag: "Hipertansiyon", explanation: "Klinik Kural: Alfa blokörler (Doksazosin, Terazosin) şiddetli ortostatik hipotansiyona ('İlk Doz Senkobu') neden olur. Düşüp kalça kırmamak için ilk doz gece yatmadan önce alınmalıdır." },
  { q: "Aldosteron/Renin oranının çok yüksek olduğu Primer Hiperaldosteronizm (Conn Sendromu) hastasında, bilateral hiperplazi varlığında medikal tedavi olarak hangisi başlanır?", options: ["Spironolakton", "Furosemid", "Amlodipin", "Hidroklorotiazid"], answer: 0, tag: "Hipertansiyon", explanation: "Conn Sendromunda aldosteron aşırı yüksektir. Tedavide aldosteron antagonisti (MRA) olan Spironolakton veya Eplerenon verilir." },
  { q: "MRA grubu potasyum tutucu diüretik kullanan bir erkek hastada 'Jinekomasti' (meme büyümesi) şikayeti başlamıştır. Bu yan etkiye sebep olan etken madde hangisidir?", options: ["Eplerenon", "Amilorid", "Spironolakton", "Triamteren"], answer: 2, tag: "Diüretik", explanation: "Şifre: Spir = Spiral meme (Jinekomasti) yapar. Eplerenon ise 'Epi/Temiz'dir, jinekomasti yapmaz." },
  { q: "Potasyum tutucu diüretiklerden hangisinin nefrotoksisitesi YOKTUR ve günde tek doz kullanım kolaylığı sağlar?", options: ["Triamteren", "Amilorid", "Spironolakton", "Eplerenon"], answer: 1, tag: "Diüretik", explanation: "Şifre: Amilorid = Adil/Masumdur, nefrotoksisitesi yoktur. Triamteren = Toksiktir (nefrotoksik)." },
  { q: "Acil servise başvuran hipertansiyon hastasının kan basıncı 190/120 mmHg'dir. Göz muayenesinde papilödem ve tahlillerinde Akut Böbrek Hasarı (ABH) saptanmıştır. Teşhis nedir?", options: ["Hipertansif Aciliyet (Urgency)", "İzole Sistolik Hipertansiyon", "Hipertansif Acil (Emergency)", "Dirençli Hipertansiyon"], answer: 2, tag: "Hipertansiyon", explanation: "Acil (Emergency) ile Aciliyet (Urgency) arasındaki TEK fark 'Son Organ Hasarı'dır. Papilödem ve ABH birer son organ hasarı olduğu için teşhis Hipertansif Acildir." },
  { q: "Tiazid ve Loop (Kıvrım) diüretiklerinin her ikisi de idrarla hangi elektroliti aşırı atarak hastayı aritmi riskine sokar ve bu yüzden Potasyum Tutucularla kombine edilir?", options: ["Hiponatremi", "Hipomagnezemi", "Hipokalemi", "Hiperkalsemi"], answer: 2, tag: "Diüretik", explanation: "Tiazid ve Loop diüretiklerinin ortak ve en sık görülen yan etkisi Hipokalemi'dir (Potasyum düşüklüğü). Bunu önlemek için Spironolakton gibi potasyum tutucularla kombine edilirler." },
  { q: "Feokromositoma tanısı alan (katekolaminleri aşırı yüksek) bir hipertansiyon hastasında tedaviye HANGİ İLAÇ GRUBU İLE başlanması zorunludur?", options: ["Beta Blokörler", "ACE İnhibitörleri", "Alfa Blokörler", "Kalsiyum Kanal Blokörleri"], answer: 2, tag: "Hipertansiyon", explanation: "Klinik Sıralama: Feokromositomada ÖNCE Alfa Blokörler başlanır. Eğer önce Beta Blokör başlanırsa ölümcül Rebound Hipertansiyon (ani tansiyon fırlaması) gelişir." },
  { q: "2025 yılı güncel kılavuzlarına göre, 10 yıllık kardiyovasküler riski hesaplamada kullanılan PREVENT denkleminin eski PCE denklemine göre en büyük üstünlüğü nedir?", options: ["Sadece 65 yaş üzerinde kullanılması", "Irk değişkenini kaldırması ve Kalp Yetmezliğini de hesaplamaya dahil etmesi", "Sadece Tip 1 diyabetlilere özel olması", "Göz muayenesi sonuçlarına dayanması"], answer: 1, tag: "Hipertansiyon", explanation: "PREVENT 2025 Denklemi: Irk ayrımını (siyahi vb.) kaldırmıştır, böbrek fonksiyonlarını dahil etmiştir ve kalp yetmezliğini de bir risk/sonlanım olarak hesaplar." },
  { q: "Hipertansiyon ve taşikardisi olan bir hastada, hem kalp hızını düşüren hem de Nitrik Oksit (NO) salınımı yaparak damarları genişleten (vazodilatasyon) en ideal Beta Blokör hangisidir?", options: ["Propranolol", "Metoprolol", "Bisoprolol", "Nebivolol"], answer: 3, tag: "Hipertansiyon", explanation: "Nebivolol, beta-1 selektif etkisinin yanında Nitrik Oksit (NO) üzerinden vazodilatasyon yaparak tansiyonu çok daha iyi düşüren özel bir beta blokördür." },

  // İLERİ KLİNİK VAKALAR & ETKİLEŞİMLER (26-30)
  { q: "Karaciğer yetmezliği (Siroz) olan bir hastada postprandiyal (tokluk) kan şekerini düşürmek için sülfonilüre kontrendikedir. Meglitinid grubundan böbrekten en az atılan ve en GÜVENLİ olan ajan hangisidir?", options: ["Nateglinid", "Repaglinid", "Glimepirid", "Gliklazid"], answer: 1, tag: "Vaka", explanation: "Karaciğer ve böbrek yetmezliğinde meglitinidlerden 'Repaglinid' çok daha güvenlidir çünkü böbrekten atılımı çok düşüktür. Nateglinid'in aktif metabolitleri böbrekte birikebilir." },
  { q: "Atorvastatin (CYP3A4 substratı) kullanan bir hastaya pnömoni tedavisi için Klaritromisin (güçlü CYP3A4 inhibitörü) başlanmıştır. Bu etkileşimin klinik sonucu ne olur?", options: ["Atorvastatin'in kan düzeyi artar ve Miyopati/Rabdomiyoliz riski oluşur.", "Atorvastatin inaktif hale gelir ve kolesterol fırlar.", "Klaritromisin emilemez ve enfeksiyon ilerler.", "İlaçlar midede çökelti oluşturur."], answer: 0, tag: "Vaka", explanation: "Etkileşim: Klaritromisin karaciğerdeki CYP3A4 enzimini kilitler. Atorvastatin metabolize olamaz, kanda birikir ve kas yıkımına (Rabdomiyoliz) neden olur." },
  { q: "Diyabetik Ketoasidoz (DKA) tanısıyla yoğun bakıma alınan hastada, kan şekeri IV İnsülin ve sıvı desteği ile 250 mg/dL'nin altına düşürülmüştür. Hipoglisemiyi önlemek için bir sonraki adım ne olmalıdır?", options: ["İnsülin tamamen kesilmelidir.", "Dekstroz + İnsülin infüzyonuna geçilmelidir.", "Sülfonilüre hapına geçilmelidir.", "Sadece SF (%0.9 NaCl) ile izleme devam edilmelidir."], answer: 1, tag: "Vaka", explanation: "DKA Tedavi Protokolü: Şeker 250'nin altına indiğinde insülin hemen kesilmez (asidoz sürüyordur). Hastayı hipoglisemiden korumak için tedaviye Dekstroz (şeker) eklenerek 'Dekstroz + İnsülin' birlikte verilir." },
  { q: "SGLT2 İnhibitörü (Örn: Empagliflozin) kullanan bir hastada yüksek ateş, halsizlik ve genital/perineal bölgede eritemli, şiş ve aşırı ağrılı bir apse oluşmuştur. Bu acil tablonun adı nedir?", options: ["Diyabetik Ayak İnfeksiyonu", "Akut Pankreatit", "Fournier Gangreni", "Laktik Asidoz"], answer: 2, tag: "Vaka", explanation: "Fournier Gangreni: SGLT2 inhibitörlerine bağlı olarak idrarda şekerin artmasıyla gelişen, genital bölgede hızla ilerleyen nekrotizan fasiit (apse/kangren) tablosudur. İlaç derhal kesilir." },
  { q: "Bir hasta HbA1c değeri %9.5 olarak kliniğe gelmiştir. Yapılan tahlillerde C-peptid değeri 0.3 ng/mL (Normalde >2 olmalı) olarak bulunmuştur. Bu hastada BAŞLANMASI ZORUNLU olan tedavi nedir?", options: ["Sadece Metformin başlanıp 3 ay beklenmesi", "Yaşam tarzı değişikliği ve Akarboz", "Sülfonilüre + DPP-4 İnhibitörü", "Bazal + Bolus İnsülin Tedavisi"], answer: 3, tag: "Vaka", explanation: "Klinik Yorum: C-Peptid'in 0.5'in altında olması pankreastaki insülin rezervinin TAMAMEN BİTTİĞİNİ gösterir (Tip 1 DM veya İleri Tip 2 DM). Dışarıdan insülin (Bazal+Bolus) vermek zorunludur." }
];

// Şıkları karıştırma ve doğru cevabın yeni indeksini bulma
questions.forEach(qObj => {
  const correctText = qObj.options[qObj.answer];
  for (let i = qObj.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qObj.options[i], qObj.options[j]] = [qObj.options[j], qObj.options[i]];
  }
  qObj.answer = qObj.options.indexOf(correctText);
});

// Soruları genel olarak rastgele harmanlama
for (let i = questions.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [questions[i], questions[j]] = [questions[j], questions[i]];
}

let peer = null;
let isHost = false;
let myName = "";
let myPeerId = "";
let hostConn = null;

let players = [];
let currentQ = -1;
let timer = null;
let timeLeft = 30; // Vaka okuma süresi 30 saniye

function enterGame() {
  myName = document.getElementById('my-name').value.trim();
  if (!myName) return alert("Lütfen adınızı girin!");

  document.getElementById('login-card').style.display = 'none';
  document.getElementById('lobby-card').style.display = 'block';

  peer = new Peer(ROOM_NAME);

  peer.on('open', (id) => {
    isHost = true;
    myPeerId = id;
    players.push({ id: myPeerId, name: myName, score: 0, correctCount: 0, streak: 0, answer: null, wasCorrect: false });
    document.getElementById('host-actions').style.display = 'block';
    document.getElementById('wait-msg').style.display = 'none';
    renderLobby();

    peer.on('connection', (conn) => {
      conn.on('data', (data) => handleHostData(conn, data));
      conn.on('close', () => {
        players = players.filter(p => p.id !== conn.peer);
        renderLobby();
        broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
      });
    });
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      isHost = false;
      joinAsClient();
    }
  });
}

function joinAsClient() {
  peer = new Peer();
  peer.on('open', (id) => {
    myPeerId = id;
    hostConn = peer.connect(ROOM_NAME);
    hostConn.on('open', () => {
      hostConn.send({ type: 'JOIN', name: myName });
    });
    hostConn.on('data', (data) => handleClientData(data));
  });
}

function handleHostData(conn, data) {
  if (data.type === 'JOIN') {
    players.push({ conn, id: conn.peer, name: data.name, score: 0, correctCount: 0, streak: 0, answer: null, wasCorrect: false });
    renderLobby();
    broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
  } else if (data.type === 'SUBMIT_ANSWER') {
    const p = players.find(x => x.id === conn.peer);
    if (p && p.answer === null) {
      p.answer = data.choice;
      checkAllAnswered();
    }
  }
}

function broadcast(msg) {
  players.forEach(p => {
    if (p.conn && p.conn.open) p.conn.send(msg);
  });
}

function renderLobby() {
  document.getElementById('player-count').innerText = `${players.length} Eczacı`;
  document.getElementById('lobby-players').innerHTML = players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
}

function startQuiz() {
  currentQ = -1;
  broadcast({ type: 'START' });
  nextQuestion();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    broadcast({ type: 'GAME_OVER' });
    handleClientData({ type: 'GAME_OVER' });
    return;
  }

  players.forEach(p => { p.answer = null; p.wasCorrect = false; });

  const q = questions[currentQ];
  const qData = {
    type: 'QUESTION',
    index: currentQ,
    total: questions.length,
    q: q.q,
    options: q.options,
    tag: q.tag,
    explanation: q.explanation
  };

  broadcast(qData);
  handleClientData(qData);
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 30;
  timer = setInterval(() => {
    timeLeft--;
    broadcast({ type: 'TICK', timeLeft });
    handleClientData({ type: 'TICK', timeLeft });

    if (timeLeft <= 0) {
      clearInterval(timer);
      evaluateRound();
    }
  }, 1000);
}

function checkAllAnswered() {
  const allDone = players.every(p => p.answer !== null);
  if (allDone) {
    clearInterval(timer);
    evaluateRound();
  }
}

function evaluateRound() {
  const correctIdx = questions[currentQ].answer;

  players.forEach(p => {
    if (p.answer === correctIdx) {
      p.wasCorrect = true;
      p.correctCount += 1;
      p.streak += 1;

      let gained = 100;
      if (p.streak >= 3) gained += 25;

      p.score += gained;
    } else {
      p.wasCorrect = false;
      p.streak = 0;
    }
  });

  players.sort((a, b) => b.score - a.score);

  const resultData = {
    type: 'ROUND_OVER',
    correctAnswer: questions[currentQ].options[correctIdx],
    explanation: questions[currentQ].explanation,
    leaderboard: players.map(p => ({ 
      name: p.name, 
      score: p.score, 
      correctCount: p.correctCount,
      streak: p.streak,
      wasCorrect: p.wasCorrect 
    })),
    isLast: currentQ + 1 >= questions.length
  };

  broadcast(resultData);
  handleClientData(resultData);

  // 12 Saniye Bilgi Kartı Bekleme Süresi
  if (!resultData.isLast) {
    setTimeout(() => {
      nextQuestion();
    }, 12000);
  } else {
    setTimeout(() => {
      broadcast({ type: 'GAME_OVER' });
      handleClientData({ type: 'GAME_OVER' });
    }, 12000);
  }
}

let selectedChoice = null;

function handleClientData(data) {
  if (data.type === 'LOBBY_UPDATE') {
    document.getElementById('player-count').innerText = `${data.players.length} Eczacı`;
    document.getElementById('lobby-players').innerHTML = data.players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
  } else if (data.type === 'START') {
    document.getElementById('lobby-card').style.display = 'none';
  } else if (data.type === 'QUESTION') {
    selectedChoice = null;
    document.getElementById('lobby-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';

    document.getElementById('q-counter').innerText = `Soru ${data.index + 1}/${data.total}`;
    
    const tagElem = document.getElementById('q-cat');
    tagElem.innerText = data.tag;
    if (data.tag === 'Diyabet') tagElem.className = 'cat-badge cat-diyabet';
    else if (data.tag === 'Hipertansiyon') tagElem.className = 'cat-badge cat-hipertansiyon';
    else if (data.tag === 'Vaka') tagElem.className = 'cat-badge cat-vaka';
    else tagElem.className = 'cat-badge cat-diuretik';

    document.getElementById('question-text').innerText = data.q;
    document.getElementById('status-footer').innerText = "Cevabınızı seçin...";
    document.getElementById('timer-bar').style.width = '100%';

    const optBox = document.getElementById('options-container');
    optBox.innerHTML = '';
    data.options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      b.onclick = () => submitAnswer(idx, b);
      optBox.appendChild(b);
    });
  } else if (data.type === 'TICK') {
    document.getElementById('time-text').innerText = `${data.timeLeft}s`;
    document.getElementById('timer-bar').style.width = `${(data.timeLeft / 30) * 100}%`;
  } else if (data.type === 'ROUND_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';

    document.getElementById('round-correct-ans').innerText = `Doğru Cevap: ${data.correctAnswer}`;
    document.getElementById('flashcard-box').innerHTML = `<strong>💡 Klinik Şifre:</strong> ${data.explanation}`;
    
    const lb = document.getElementById('leaderboard');
    lb.innerHTML = data.leaderboard.map((p, i) => {
      const statusIcon = p.wasCorrect ? (p.streak >= 2 ? `🔥x${p.streak}` : '✅') : '❌';
      return `
        <div class="leaderboard-row">
          <span>#${i + 1} ${p.name} <span style="font-size: 18px; margin-left: 6px;">${statusIcon}</span></span>
          <span style="color:#38bdf8;">${p.score} Puan <small style="color:#94a3b8; margin-left:8px;">(${p.correctCount} Doğru)</small></span>
        </div>
      `;
    }).join('');
  } else if (data.type === 'GAME_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';
    document.getElementById('round-result-title').innerText = "🏆 Maraton Tamamlandı! 🏆";
    document.getElementById('round-correct-ans').innerText = "Simülasyon sona erdi.";
    document.getElementById('flashcard-box').style.display = 'none';
  }
}

function submitAnswer(idx, btnElem) {
  if (selectedChoice !== null) return;
  selectedChoice = idx;

  btnElem.classList.add('selected');
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  document.getElementById('status-footer').innerText = "Cevabınız iletildi! Diğerleri bekleniyor...";

  const payload = { type: 'SUBMIT_ANSWER', choice: idx };
  if (isHost) {
    const me = players.find(p => p.id === myPeerId);
    if (me) { me.answer = idx; checkAllAnswered(); }
  } else if (hostConn) {
    hostConn.send(payload);
  }
}
</script>
